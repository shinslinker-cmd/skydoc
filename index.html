    <script>
      /* 앱으로 설치되게 하는 두 가지 — 주소(https)로 열었을 때만 켠다.

            그래야 드라이브 파일을 더블클릭해 쓰는 지금 방식도 그대로 굴러간다. */
      (function () {
        var web = location.protocol === 'https:' || location.protocol === 'http:';
        if (!web) return;
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.webmanifest';
        document.head.appendChild(link);
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () { /* 안 되면 그냥 웹으로 쓴다 */ });
          });
        }
      })();
    </script>

<h1>문서 편집기 파일럿</h1>
<p>이 문서 위에서 바로 시험합니다. 아래 항목을 하나씩 해 보고, 워드와 느낌이 다른 순간이 있으면 그 순간을 기억해 주세요.</p>
<h2>합격 기준 — 직접 해 보기</h2>
<ul>
  <li>한글을 빠르게 타자해 본다 (조합 중 글자가 깨지거나 밀리는지)</li>
  <li>엔터로 문단을 나누고, 백스페이스로 다시 합쳐 본다</li>
  <li>글자를 골라 <strong>굵게</strong>, <em>기울임</em>, <u>밑줄</u>을 켜고 끈다</li>
  <li>아래 표에서 Tab 키로 다음 칸, Shift+Tab 으로 이전 칸 이동</li>
  <li>행·열을 늘리고 줄여 본다 (위 단추)</li>
  <li>Ctrl+Z 로 되돌리기 — 글 수정·판 만들기·판 전환·판 값이 한 줄로 역순으로 되돌려진다</li>
  <li>Ctrl+P 인쇄 미리보기에서 머리글·바닥글·쪽 번호가 종이마다 나오는지</li>
  <li><strong>판(版)</strong>: 종이 위 시트탭에서 «＋ 새 판»을 만들고(색도 고름), 표 칸을 고른 뒤 리본의 <strong>«공통 | 판 값»</strong> 에서 «판 값»을 누르면 판별 자리가 된다 → 그 뒤로는 <strong>판을 보면서 고치면 그 판만 바뀐다</strong>(공통은 «모든 판 공통»에서) · 바탕색 = 지금 보는 판의 색, 회색 = 공통값 · 띠를 누르면 판마다 값 비교 · 판을 보며 그림을 지우면 그 판에서만 숨김(눌러서 다시 보이기) · 판별 자리를 문서에서 지우려 하면 확인창</li>
  <li><strong>그림</strong>: 리본 «그림»(파일) · <strong>Ctrl+V</strong> 붙여넣기 · 파일을 종이에 끌어놓기 → 그림 블록(폭 작게/중간/전체 · 캡션 «그림 n.» 자동 번호). 그림을 누르면 도구줄과 <strong>모서리 핸들 8개</strong>(끌어서 미세 조절). 왼쪽/오른쪽에 두면 글이 옆으로 흐른다</li>
</ul>
<h2>표 시험</h2>

  <tr><td><p>접지저항</p></td><td><p>100Ω 이하</p></td><td><p></p></td></tr>
</table>
